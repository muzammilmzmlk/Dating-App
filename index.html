n.active{background:#fff}.photoArrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#17182799;color:#fff;font-size:22px;z-index:4;cursor:pointer}.photoArrow.left{left:10px}.photoArrow.right{right:10px}.photoSwipeHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#17182799;color:#fff;padding:7px 11px;border-radius:18px;font-size:12px;z-index:3;pointer-events:none}.photo.hasMultiple .photoSwipeHint{display:block}.photo:not(.hasMultiple) .photoSwipeHint{display:none}.avatar{width:150px;height:150px;border-radius:50%;background:#dfa1b7;display:flex;align-items:center;justify-content:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.photo img{width:100%;height:100%;object-fit:cover;border-radius:24px 24px 0 0}.photo{position:relative;overflow:hidden}.photo .avatar{position:relative;z-index:1}.photo.hasImage{background:#f3edf1}.photo.hasImage .avatar{display:none}.photoCount{position:absolute;right:12px;top:12px;background:#171827aa;color:#fff;padding:6px 10px;border-radius:16px;font-size:12px;z-index:2}.photoManager{margin:20px 0}.photoManager h3{margin:0 0 6px}.photoHint{font-size:12px;color:#888;margin:0 0 12px}.photoGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.photoSlot{position:relative;aspect-ratio:1;border:1px dashed #d8d8de;border-radius:14px;background:#faf9fb;overflow:hidden;display:flex;align-items:center;justify-content:center}.photoSlot img{width:100%;height:100%;object-fit:cover}.photoSlot .slotLabel{font-size:11px;color:#888;text-align:center;padding:4px}.photoSlot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.photoSlot.addSlot{cursor:pointer}.photoSlot.addSlot:active{background:#fff0f4}.photoSlot .removePhoto{position:absolute;right:4px;top:4px;width:25px;height:25px;border:0;border-radius:50%;background:#171827cc;color:#fff;cursor:pointer;z-index:2}.uploadMsg{font-size:13px;margin-top:8 ails small{display:block;color:#888;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.mini{border:0;background:#fff0f4;color:#ef3d72;border-radius:18px;padding:8px 12px;font-weight:700;cursor:pointer}.heart{color:#ef3d72;font-size:22px}.form{max-width:600px;margin:35px auto;padding:24px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:#777;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#df3f70;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.secondary{padding:11px 15px;border:1px solid #ddd;border-radius:11px;background:#fff;cursor:pointer}.secondary:active,.primary:active{transform:scale(.99)}.settings{max-width:600px;margin:35px auto;overflow:hidden}.row{width:100%;padding:17px 18px;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;justify-content:space-between;align-items:center;font:inherit;text-align:left;cursor:pointer}.row:active{background:#fff0f4}.setting-actions{display:flex;gap:8px}.chat{min-height:520px;display:flex;flex-direction:column}.messages{flex:1;padding:18px;overflow:auto;min-height:380px}.bubble{background:#f0eff3;padding:11px 14px;border-radius:17px;max-width:75%;margin:7px 0;word-break:break-word}.me{margin-left:auto;background:#ef3d72;color:#fff}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.compose input{flex:1;border:1px solid #ddd;border-radius:22px;padding:12px;font:inherit}.compose .primary{width:auto;padding:11px 18px}.nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:center;z-index:30}.nav button{border:0;background:none;color:#888;min-width:90px;cursor:pointer}.nav button.activeNav{color:#ef3d72;font-weight:700}.nav span{display:block;font-size:21px;margin-bottom:3px}.empty{padding:48px 20px;text-align:center;color:#888}.auth{max-width:520px;margin:55px auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;padding:12px;border:1px solid #ddd;background:#fff;border-radius:10px;cursor:pointer}.tabs button.sel{background:#fff0f4;color:#ef3d72;border-color:#ef3d72;font-weight:700}.msg{padding:10px 0;color:#df3f70;font-size:14px;line-height:1.4}.success{color:#168451}.hidden{display:none!important}.backline{display:flex;align-items:center;gap:10px;margin-bottom:22px}.backline h2{margin:0}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171827;color:#fff;padding:11px 16px;border-radius:20px;z-index:50;display:none}.toast.show{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{display:none}.photo{height:390px}.nav button{min-width:65px;font-size:12px}.top{padding:0 18px}.brand{font-size:25px}}

<body>
<header class="top"><div class="brand">♥ LoveConnect</div><button id="gear" aria-label="Settings" class="hidden">⚙️</button></header>
<main class="wrap">
<section id="auth" class="screen active"><div class="form auth"><div class="brand" style="text-align:center;margin-bottom:20px">♥ LoveConnect</div><div class="tabs"><button id="loginTab" class="sel">Login</button><button id="signupTab">Create account</button></div>
<div id="authLogin"><h2>Welcome back</h2><div class="field"><label>Email</label><input id="le" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">Login</button></div>
<div id="authSignup" class="hidden"><h2>Create your account</h2><div class="field"><label>Name</label><input id="sn" autocomplete="name"></div><div class="field"><label>Email</label><input id="se" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="sp" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Age</label><input id="sa" type="number" min="18"></div><div class="field"><label>Gender</label><select id="sg"><option>Man</option><option>Woman</option><option>Other</option></select></div><div class="field"><label>Looking for</label><select id="slf"><option>Women</option><option>Men</option><option>Everyone</option></select></div><div class="field"><label>Location</label><input id="sl" placeholder="Ajman"></div><div class="field"><label>About me</label><textarea id="sb"></textarea></div><div class="field"><label>Interests</label><input id="si" placeholder="Travel, music, movies"></div><button id="signupBtn" class="primary">Create Account</button></div><div id="authMsg" class="msg"></div></div></section>

<section id="explore" class="screen"><div style="max-width:760px;margin:auto"><div class="location"><div class="locationRow"><span>📍</span><input id="locationSearch" type="search" placeholder="Search by location"><button id="locationSearchBtn">Search</button></div><div class="searchHint">Your location: <b id="myLocTop">Not set</b></div></div><p class="swipeHelp">Swipe right to like • Swipe left to pass</p><div id="exploreCard"></div></div></section>
<section id="viewed" class="screen"><div class="list"><div class="list-head"><h2>Viewed by</h2><b id="viewCount">0</b></div><div id="viewedList"></div></div></section>
<section id="liked" class="screen"><div class="list"><div class="list-head"><h2>Liked you</h2><b id="likeCount">0</b></div><div id="likedList"></div></div></section>
<section id="chats" class="screen"><div class="list"><div class="list-head"><h2>Chats</h2></div><div id="chatList"></div></div></section>
<section id="chatroom" class="screen"><div class="list chat"><div class="list-head"><button id="chatBack" class="secondary">←</button><b id="chatName">Chat</b></div><div id="messages" class="messages"></div><div class="compose"><input id="message" placeholder="Type a message"><button id="sendBtn" class="primary">Send</button></div></div></section>
<section id="profile" class="screen"><div class="form"><div style="text-align:center"><div class="avatar" style="margin:auto" id="myAvatar">M</div><div id="myPhotoGallery" class="photoGrid" style="margin:18px 0;display:none"></div><h2 id="myName">Profile</h2><p class="muted" id="myLocation"></p></div><div id="myProfileDetails" class="detailList"></div><button id="editProfileBtn" class="primary" style="margin-top:20px">Edit Profile</button></div></section>
<section id="edit" class="screen"><form id="editForm" class="form"><div class="backline"><button type="button" id="editBack" class="secondary">← Back</button><h2>Edit Profile</h2></div><div class="field"><label>Name</label><input id="en" required></div><div class="field"><label>Age</label><input id="ea" type="number" min="18" required></div><div class="field"><label>Gender</label><select id="eg"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="field"><label>Looking for</label><select id="elf"><option value="Women">Women</option><option value="Men">Men</option><option value="Everyone">Everyone</option></select></div><div class="field"><label>Location</label><input id="el" required></div><div class="field"><label>About me</label><textarea id="eb"></textarea></div><div class="field"><label>Interests</label><input id="ei"></div><div class="photoManager"><h3>Profile Photos</h3><p class="photoHint">Add up to 5 photos: 1 main profile photo + 4 extra photos.</p><div id="photoGrid" class="photoGrid"></div><div id="uploadMsg" class="uploadMsg"></div></div><button class="primary">Save Profile</button><div id="editMsg" class="msg"></div></form></section>
<section id="settings" class="screen"><div class="list settings"><div class="list-head"><h2>Settings</h2></div><button class="row settingBtn" data-setting="account">Account <span>›</span></button><button class="row settingBtn" data-setting="notifications">Notifications <span>›</span></button><button class="row settingBtn" data-setting="privacy">Privacy &amp; Safety <span>›</span></button><button class="row settingBtn" data-setting="help">Help &amp; Support <span>›</span></button><div class="row"><button id="logoutBtn" class="secondary">Logout</button></div></div></section>
<section id="settingDetail" class="screen"><div class="form"><div class="backline"><button id="detailBack" class="secondary">← Settings</button><h2 id="settingTitle"></h2></div><div id="settingBody" class="bio"></div></div></section>
</main>
<nav id="nav" class="nav hidden"><button data-s="explore"><span>◈</span>Explore</button><button data-s="viewed"><span>♧</span>Viewed by</button><button data-s="chats"><span>💬</span>Chats</button><button data-s="liked"><span>♡</span>Liked you</button><button data-s="profile"><span>♙</span>Profile</button></nav><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://deiwduvfskhqfzjpzyha.supabase.co';
const SUPABASE_KEY='sb_publishable_ccXAv4AC1GPc2Bo795yfhQ_E8c0rypY';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let me=null,profiles=[],filteredProfiles=[],currentIndex=0,currentChatUser=null,realtime=null,locationQuery="",booting=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function show(id){const target=$(id);if(!target)return;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));target.classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('activeNav',b.dataset.s===id));if(id==='viewed')loadViewed();if(id==='liked')loadLiked();if(id==='chats')loadChats();if(id==='profile')loadMe();}
function showAuth(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('auth').classList.add('active');$('nav').classList.add('hidden');$('gear').classList.add('hidden')}
function authMode(mode){$('authLogin').classList.toggle('hidden',mode!=='login');$('authSignup').classList.toggle('hidden',mode!=='signup');$('loginTab').classList.toggle('sel',mode==='login');$('signupTab').classList.toggle('sel',mode==='signup');$('authMsg').textContent=''}
async function login(){const email=$('le').value.trim(),password=$('lp').value;if(!email||!password){$('authMsg').textContent='Enter email and password.';return}$('loginBtn').disabled=true;$('authMsg').textContent='Signing in...';const {data,error}=await sb.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error){$('authMsg').textContent=error.message;return}await boot(data.session)}
async function signup(){const msg=$('authMsg');const name=$('sn').value.trim(),email=$('se').value.trim(),password=$('sp').value,age=Number($('sa').value),gender=$('sg').value,looking_for=$('slf').value,location=$('sl').value.trim(),about=$('sb').value.trim(),interests=$('si').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!email||!password||age<18||!location){msg.textContent='Please complete the required fields. Age must be 18 or older.';return}$('signupBtn').disabled=true;msg.textContent='Creating account...';const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,age,gender,looking_for,location,about,interests}}});$('signupBtn').disabled=false;if(error){msg.textContent=error.message;return}if(data.session){me=data.session.user;await ensureProfile({name,age,gender,looking_for,location,about,interests});await boot(data.session)}else{msg.innerHTML='<span class="success">Account created. You can now login without email verification.</span>'}}
async function ensureProfile(values={}){if(!me)return;const {data:existing}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();const m=me.user_metadata||{};const has=v=>v!==undefined&&v!==null&&v!=='';const payload={id:me.id,name:has(values.name)?values.name:(existing?.name??m.name??''),age:has(values.age)?Number(values.age):(existing?.age??(has(m.age)?Number(m.age):null)),gender:has(values.gender)?values.gender:(existing?.gender??m.gender??''),looking_for:has(values.looking_for)?values.looking_for:(existing?.looking_for??m.looking_for??''),location:has(values.location)?values.location:(existing?.location??m.location??''),about:has(values.about)?values.about:(existing?.about??m.about??''),interests:Array.isArray(values.interests)?values.interests:(Array.isArray(existing?.interests)?existing.interests:(Array.isArray(m.interests)?m.interests:[])),photo_urls:Array.isArray(existing?.photo_urls)?existing.photo_urls:[]};const {error}=existing?await sb.from('profiles').update(payload).eq('id',me.id):await sb.from('profiles').insert(payload);if(error)console.error(error)}
async function boot(session){if(booting)return;if(!session){const r=await sb.auth.getSession();session=r.data.session}if(!session){showAuth();return}booting=true;try{me=session.user;await ensureProfile();await loadMe();await loadExplore();$('nav').classList.remove('hidden');$('gear').classList.remove('hidden');show('explore');subscribeMessages()}finally{booting=false}}
async function loadMe(){const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();window.meProfile=data||{};const p=window.meProfile;$('myName').textContent=p.name||'Your Profile';$('myLocation').textContent=p.location||'';renderAvatar('myAvatar',p);renderMyGallery(p);$('myLocTop').textContent=p.location||'Not set';renderMyProfileDetails(p)}
function renderMyProfileDetails(p){const rows=[];if(p.about)rows.push(`<div class="detailItem"><b>About me</b>${esc(p.about)}</div>`);if(p.age)rows.push(`<div class="detailItem"><b>Age</b>${esc(p.age)}</div>`);if(p.gender)rows.push(`<div class="detailItem"><b>Gender</b>${esc(p.gender)}</div>`);if(p.looking_for)rows.push(`<div class="detailItem"><b>Looking for</b>${esc(p.looking_for)}</div>`);if(p.location)rows.push(`<div class="detailItem"><b>Location</b>${esc(p.location)}</div>`);if(Array.isArray(p.interests)&&p.interests.length)rows.push(`<div class="detailItem"><b>Interests</b><div class="detailTags">${p.interests.map(x=>`<span class="detailTag">${esc(x)}</span>`).join('')}</div></div>`);$('myProfileDetails').innerHTML=rows.join('')||'<div class="empty">Add your profile details from Edit Profile.</div>'}
async function loadExplore(){const {data,error}=await sb.from('profiles').select('*').neq('id',me.id).order('created_at',{ascending:false});if(error){$('exploreCard').innerHTML='<div class="card empty">'+esc(error.message)+'</div>';return}profiles=data||[];applyLocationSearch(false)}
function applyLocationSearch(reset=true){locationQuery=$('locationSearch')?.value.trim()||'';filteredProfiles=locationQuery?profiles.filter(p=>String(p.location||'').toLowerCase().includes(locationQuery.toLowerCase())):profiles.slice();if(reset)currentIndex=0;else currentIndex=Math.min(currentIndex,Math.max(filteredProfiles.length-1,0));renderExplore()}
function renderExplore(){
  if(currentIndex>=filteredProfiles.length){
    const text=locationQuery?`No profiles found in “${esc(locationQuery)}”.`:'No more profiles';
    $('exploreCard').innerHTML=`<div class="card empty"><h3>${text}</h3><p>${locationQuery?'Try another location or clear the search.':'New members will appear here when profiles are available.'}</p></div>`;
    return;
  }
  const p=filteredProfiles[currentIndex];
  const photos=Array.isArray(p.photo_urls)?p.photo_urls.filter(Boolean):[];
  const initials=esc((p.name||'?').charAt(0).toUpperCase());
  const photoMarkup=photos.length?`<div class="photoCarousel" id="photoCarousel">${photos.map((u,i)=>`<div class="photoSlide"><img src="${esc(u)}" alt="${esc(p.name||'Profile')} photo ${i+1}" loading="${i===0?'eager':'lazy'}"></div>`).join('')}</div>${photos.length>1?`<button class="photoArrow left" id="photoPrev" aria-label="Previous photo">‹</button><button class="photoArrow right" id="photoNext" aria-label="Next photo">›</button><div class="photoDots" id="photoDots">${photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div><div class="photoSwipeHint">Swipe left or right</div>`:''}`:`<div class="avatar">${initials}</div>`;
  $('exploreCard').innerHTML=`<div class="card swipeCard" id="swipeCard"><span class="swipeLabel likeLabel" id="likeLabel">INTERESTED ♥</span><span class="swipeLabel passLabel" id="passLabel">PASS ✕</span><div class="photo ${photos.length?'hasImage':''} ${photos.length>1?'hasMultiple':''}">${photoMarkup}${photos.length?`<span class="photoCount">${photos.length} photo${photos.length>1?'s':''}</span>`:''}</div><div class="info"><div class="name">${esc(p.name||'Member')}${p.age?', '+esc(p.age):''}</div><div class="online">● Member</div>${p.location?`<div class="muted">📍 ${esc(p.location)}</div>`:''}${p.about?`<div class="detailItem" style="margin-top:14px"><b>About me</b>${esc(p.about)}</div>`:''}${p.gender?`<div class="detailItem"><b>Gender</b>${esc(p.gender)}</div>`:''}${p.looking_for?`<div class="detailItem"><b>Looking for</b>${esc(p.looking_for)}</div>`:''}${p.interests?.length?`<div class="detailItem"><b>Interests</b><div class="detailTags">${p.interests.map(x=>`<span class="detailTag">${esc(x)}</span>`).join('')}</div></div>`:''}</div><div class="actions"><button class="round" id="passBtn" aria-label="Not interested">✕</button><button class="round like" id="likeBtn" aria-label="Interested">♥</button></div></div>`;
  viewProfile(p.id);
  $('passBtn').onclick=()=>passProfile();
  $('likeBtn').onclick=()=>likeProfile(p.id);
  setupProfileSwipe();

  if(photos.length>1){
    const carousel=$('photoCarousel'),dots=[...$('photoDots').children];
    const goTo=i=>{const idx=Math.max(0,Math.min(i,photos.length-1));carousel.scrollTo({left:idx*carousel.clientWidth,behavior:'smooth'})};
    $('photoPrev').onclick=()=>goTo(Math.round(carousel.scrollLeft/carousel.clientWidth)-1);
    $('photoNext').onclick=()=>goTo(Math.round(carousel.scrollLeft/carousel.clientWidth)+1);
    carousel.addEventListener('scroll',()=>{const idx=Math.round(carousel.scrollLeft/carousel.clientWidth);dots.forEach((d,i)=>d.classList.toggle('active',i===idx));},{passive:true});
    let startX=0,startScroll=0;
    carousel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startScroll=carousel.scrollLeft},{passive:true});
    carousel.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;const threshold=45;const idx=Math.round(startScroll/carousel.clientWidth);if(Math.abs(dx)>=threshold)goTo(idx+(dx<0?1:-1))},{passive:true});
    setTimeout(()=>{const hint=document.querySelector('.photoSwipeHint');if(hint)setTimeout(()=>hint.remove(),2200)},1200);
  }
}
function passProfile(){currentIndex++;renderExplore()}
function setupProfileSwipe(){
  const card=$('swipeCard'); if(!card)return;
  let startX=0,startY=0,dx=0,dragging=false;
  const reset=()=>{card.classList.remove('dragging');card.style.transform='';card.style.opacity='';$('likeLabel').style.opacity=0;$('passLabel').style.opacity=0};
  const move=(x,y)=>{dx=x-startX;const dy=y-startY;if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy))return;dragging=true;card.classList.add('dragging');card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;card.style.opacity=String(Math.max(.72,1-Math.abs(dx)/500));$('likeLabel').style.opacity=String(Math.min(1,Math.max(0,dx/100)));$('passLabel').style.opacity=String(Math.min(1,Math.max(0,-dx/100)))};
  const end=()=>{if(!dragging){reset();return}const threshold=110;if(Math.abs(dx)>=threshold){const liked=dx>0;card.style.transform=`translateX(${liked?120:-120}%) rotate(${liked?12:-12}deg)`;card.style.opacity='0';setTimeout(()=>{if(liked)likeProfile(filteredProfiles[currentIndex].id);else passProfile()},140)}else reset();dragging=false;dx=0};
  card.addEventListener('pointerdown',e=>{if(e.target.closest('.photoCarousel,.photoArrow,.actions,button'))return;startX=e.clientX;startY=e.clientY;dx=0;dragging=false;card.setPointerCapture?.(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(startX===0)return;move(e.clientX,e.clientY)});
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',()=>{dragging=false;dx=0;reset()});
}
async function likeProfile(id){const {error}=await sb.from('likes').upsert({liker_id:me.id,liked_id:id},{onConflict:'liker_id,liked_id',ignoreDuplicates:true});if(error){toast(error.message);return}toast('Liked ♥');currentIndex++;renderExplore()}
async function loadViewed(){const {data,error}=await sb.from('profile_views').select('viewer_id,created_at').eq('viewed_id',me.id).order('created_at',{ascending:false});if(error){$('viewedList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const ids=(data||[]).map(x=>x.viewer_id);$('viewCount').textContent=ids.length;await renderPeopleByIds('viewedList',ids,'Viewed you')}
async function loadLiked(){const {data,error}=await sb.from('likes').select('liker_id,created_at').eq('liked_id',me.id).order('created_at',{ascending:false});if(error){$('likedList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const ids=(data||[]).map(x=>x.liker_id);$('likeCount').textContent=ids.length;await renderPeopleByIds('likedList',ids,'Liked you')}
async function renderPeopleByIds(el,ids,label){if(!ids.length){$(el).innerHTML='<div class="empty">No '+label.toLowerCase()+' activity yet.</div>';return}const {data,error}=await sb.from('profiles').select('*').in('id',ids);if(error){$(el).innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const map=new Map((data||[]).map(x=>[x.id,x]));$(el).innerHTML=ids.map(id=>{const p=map.get(id);if(!p)return '';return `<div class="person click" data-chat="${esc(p.id)}"><div class="miniavatar">${esc((p.name||'?')[0].toUpperCase())}</div><div class="details"><b>${esc(p.name||'Member')}${p.age?', '+esc(p.age):''}</b><small>${esc(p.location||'')}</small></div>${label==='Liked you'?'<span class="heart">♥</span>':'<button class="mini">Chat</button>'}</div>`}).join('')||'<div class="empty">No activity yet.</div>';$(el).querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>startChat(x.dataset.chat))}
async function loadChats(){const {data,error}=await sb.from('messages').select('*').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:false});if(error){$('chatList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const map=new Map();(data||[]).forEach(m=>{const other=m.sender_id===me.id?m.receiver_id:m.sender_id;if(!map.has(other))map.set(other,m)});const ids=[...map.keys()];if(!ids.length){$('chatList').innerHTML='<div class="empty">No chats yet. When you have messages, they will appear here.</div>';return}const {data:ps}=await sb.from('profiles').select('*').in('id',ids);const pm=new Map((ps||[]).map(x=>[x.id,x]));$('chatList').innerHTML=ids.map(id=>{const p=pm.get(id),m=map.get(id);return `<div class="person click" data-chat="${esc(id)}"><div class="miniavatar">${esc((p?.name||'?')[0].toUpperCase())}</div><div class="details"><b>${esc(p?.name||'Member')}</b><small>${esc(m.body)}</small></div><small>${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small></div>`}).join('');$('chatList').querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>startChat(x.dataset.chat))}
async function startChat(id){currentChatUser=id;const {data:p}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();$('chatName').textContent=p?.name||'Chat';await loadMessages();show('chatroom')}
async function loadMessages(){if(!currentChatUser)return;const {data,error}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${me.id})`).order('created_at',{ascending:true});if(error){$('messages').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}$('messages').innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'me':''}">${esc(m.body)}</div>`).join('')||'<div class="empty">Start the conversation.</div>';$('messages').scrollTop=$('messages').scrollHeight}
async function send(){const body=$('message').value.trim();if(!body||!currentChatUser)return;const {error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:currentChatUser,body});if(error){toast(error.message);return}$('message').value='';await loadMessages()}
function subscribeMessages(){if(realtime)sb.removeChannel(realtime);realtime=sb.channel('loveconnect-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{if(currentChatUser&&(payload.new.sender_id===currentChatUser||payload.new.receiver_id===currentChatUser))loadMessages()}).subscribe()}
function toggleSettings(){const s=$("settings"),d=$("settingDetail");if(s?.classList.contains('active')||d?.classList.contains('active'))closeSettings();else openSettings();}
function openSettings(){if(!me)return;show('settings')}
function closeSettings(){show('explore')}
function showSetting(type){const d={account:['Account','Your LoveConnect account is managed securely through Supabase.'],notifications:['Notifications','Notification preferences will appear here when notification controls are enabled.'],privacy:['Privacy & Safety','Your profile activity and messages are protected by database security policies. Never share your password with another person.'],help:['Help & Support','For now, use the Back button to return to Settings.']};const item=d[type];if(!item)return;$('settingTitle').textContent=item[0];$('settingBody').textContent=item[1];show('settingDetail')}
function fillEdit(){const p=window.meProfile||{},m=me?.user_metadata||{};$('en').value=p.name??m.name??'';$('ea').value=p.age??m.age??'';$('eg').value=p.gender??m.gender??'';$('elf').value=p.looking_for??m.looking_for??'';$('el').value=p.location??m.location??'';$('eb').value=p.about??m.about??'';$('ei').value=(Array.isArray(p.interests)?p.interests:(Array.isArray(m.interests)?m.interests:[])).join(', ');renderPhotoManager(p.photo_urls||[])}
function publicPhotoUrl(path){return sb.storage.from('profile-photos').getPublicUrl(path).data.publicUrl}
function renderAvatar(id,p){const el=$(id);const url=(p?.photo_urls||[])[0]||'';if(url){el.innerHTML=`<img src="${esc(url)}" alt="Profile photo">`}else{el.textContent=(p?.name||'M').charAt(0).toUpperCase()}}
function renderMyGallery(p){const urls=p?.photo_urls||[];const g=$('myPhotoGallery');if(!urls.length){g.style.display='none';g.innerHTML='';return}g.style.display='grid';g.innerHTML=urls.map((u,i)=>`<div class="photoSlot"><img src="${esc(u)}" alt="Photo ${i+1}"></div>`).join('')}
function renderPhotoManager(urls){const arr=Array.isArray(urls)?urls:[];$('photoGrid').innerHTML=Array.from({length:5},(_,i)=>{const u=arr[i]||'';return u?`<div class="photoSlot"><img src="${esc(u)}" alt="Photo ${i+1}"><button type="button" class="removePhoto" data-remove="${i}" aria-label="Remove photo">×</button></div>`:`<label class="photoSlot addSlot"><div class="slotLabel">${i===0?'Main photo':'Extra photo '+i}<br><strong>＋ Add photo</strong></div><input type="file" accept="image/jpeg,image/png,image/webp" data-photo="${i}"></label>`}).join('');$('photoGrid').querySelectorAll('[data-photo]').forEach(input=>input.addEventListener('change',e=>handlePhotoUpload(e,iFrom(input.dataset.photo))));$('photoGrid').querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>removePhoto(Number(btn.dataset.remove)))}
function iFrom(v){return Number(v)}
async function handlePhotoUpload(e,index){const file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Please choose JPG, PNG or WebP.');return}if(file.size>5*1024*1024){toast('Each photo must be 5 MB or smaller.');return}if(!me){toast('Please login again.');return}const p=window.meProfile||{};const urls=[...(p.photo_urls||[])];if(urls.length>=5){toast('Maximum 5 photos.');return}if(index>urls.length){index=urls.length}const localPreview=URL.createObjectURL(file);const previous=[...urls];urls[index]=localPreview;window.meProfile.photo_urls=urls;renderPhotoManager(urls);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);$('uploadMsg').textContent='Uploading photo...';try{const ext=(file.type.split('/')[1]||'jpg').toLowerCase();const path=`${me.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('profile-photos').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(error)throw error;const url=publicPhotoUrl(path);urls[index]=url;const {error:updateError}=await sb.from('profiles').update({photo_urls:urls}).eq('id',me.id);if(updateError){await sb.storage.from('profile-photos').remove([path]);throw updateError}window.meProfile.photo_urls=urls;renderPhotoManager(urls);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);await loadExplore();$('uploadMsg').textContent='Photo added successfully.'}catch(err){window.meProfile.photo_urls=previous;renderPhotoManager(previous);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);$('uploadMsg').textContent=err?.message||'Photo upload failed.'}finally{URL.revokeObjectURL(localPreview);setTimeout(()=>$('uploadMsg').textContent='',2200)}}
async function removePhoto(index){const urls=[...(window.meProfile?.photo_urls||[])];const url=urls[index];if(!url)return;const marker='/storage/v1/object/public/profile-photos/';const pos=url.indexOf(marker);const path=pos>=0?decodeURIComponent(url.slice(pos+marker.length)):'';$('uploadMsg').textContent='Removing photo...';if(path)await sb.storage.from('profile-photos').remove([path]);urls.splice(index,1);const {error}=await sb.from('profiles').update({photo_urls:urls}).eq('id',me.id);if(error){$('uploadMsg').textContent=error.message;return}window.meProfile.photo_urls=urls;renderPhotoManager(urls);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);await loadExplore();$('uploadMsg').textContent='Photo removed.';setTimeout(()=>$('uploadMsg').textContent='',1800)}
async function saveProfile(e){e.preventDefault();const payload={name:$('en').value.trim(),age:Number($('ea').value),gender:$('eg').value.trim(),looking_for:$('elf').value.trim(),location:$('el').value.trim(),about:$('eb').value.trim(),interests:$('ei').value.split(',').map(x=>x.trim()).filter(Boolean),photo_urls:window.meProfile?.photo_urls||[]};const {error}=await sb.from('profiles').update(payload).eq('id',me.id);if(error){$('editMsg').textContent=error.message;return}await loadMe();await loadExplore();show('profile');toast('Profile saved')}
async function logout(){await sb.auth.signOut();me=null;profiles=[];window.meProfile=null;showAuth();authMode('login')}
$('loginTab').onclick=()=>authMode('login');$('locationSearchBtn').onclick=()=>applyLocationSearch(true);$('locationSearch').addEventListener('input',()=>applyLocationSearch(true));$('locationSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyLocationSearch(true)}});$('signupTab').onclick=()=>authMode('signup');$('loginBtn').onclick=login;$('signupBtn').onclick=signup;$('gear').onclick=toggleSettings;const bind=(id,event,fn)=>{const el=$(id);if(el)el.addEventListener(event,fn)};bind('detailBack','click',()=>show('settings'));bind('chatBack','click',()=>show('chats'));bind('sendBtn','click',send);bind('message','keydown',e=>{if(e.key==='Enter')send()});bind('editProfileBtn','click',()=>{fillEdit();show('edit')});bind('editBack','click',()=>show('profile'));bind('editForm','submit',saveProfile);bind('logoutBtn','click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s)));document.querySelectorAll('.settingBtn').forEach(b=>b.addEventListener('click',()=>showSetting(b.dataset.setting)));
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){me=null;window.meProfile=null;showAuth()}else if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&session&&!me){boot(session)}});
(async()=>{const {data}=await sb.auth.getSession();if(data.session){await boot(data.session)}else{showAuth()}})();
</script>
