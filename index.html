<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#faf9fb;color:#171827}.top{height:76px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;padding:0 5%;position:sticky;top:0;z-index:20}.brand{font-size:28px;font-weight:800;color:#df3f70}.top button{border:0;background:none;font-size:25px;cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:22px 14px 100px}.screen{display:none}.screen.active{display:block}.card,.list,.form{background:#fff;border:1px solid #eee;border-radius:24px;box-shadow:0 8px 25px #0000000a}.grid{display:grid;grid-template-columns:520px 1fr;gap:20px}.location{padding:14px 16px;background:#fff;border-radius:14px;margin-bottom:12px;border:1px solid #eee}.photo{height:430px;background:linear-gradient(135deg,#f2c3d2,#eadde7);display:flex;align-items:center;justify-content:center;font-size:90px;color:#fff;border-radius:24px 24px 0 0}.avatar{width:150px;height:150px;border-radius:50%;background:#dfa1b7;display:flex;align-items:center;justify-content:center}.info{padding:18px}.name{font-size:28px;font-weight:800}.muted{color:#7d7e8b}.online{color:#1da468;font-size:14px;margin-top:7px}.bio{line-height:1.5;margin-top:14px}.actions{display:flex;justify-content:center;gap:14px;padding:5px 15px 20px}.round{width:58px;height:58px;border-radius:50%;border:1px solid #eee;background:#fff;font-size:23px;cursor:pointer}.round:active{transform:scale(.96)}.like{background:#ef3d72;color:#fff}.feature{padding:20px;margin-bottom:14px}.list-head{padding:18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:12px}.list-head h2{margin:0}.person{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #eee}.person.click{cursor:pointer}.miniavatar{width:50px;height:50px;border-radius:50%;background:#dfa1b7;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.details{flex:1;min-width:0}.details small{display:block;color:#888;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.mini{border:0;background:#fff0f4;color:#ef3d72;border-radius:18px;padding:8px 12px;font-weight:700;cursor:pointer}.heart{color:#ef3d72;font-size:22px}.form{max-width:600px;margin:35px auto;padding:24px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:#777;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#df3f70;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.secondary{padding:11px 15px;border:1px solid #ddd;border-radius:11px;background:#fff;cursor:pointer}.secondary:active,.primary:active{transform:scale(.99)}.settings{max-width:600px;margin:35px auto;overflow:hidden}.row{width:100%;padding:17px 18px;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;justify-content:space-between;align-items:center;font:inherit;text-align:left;cursor:pointer}.row:active{background:#fff0f4}.setting-actions{display:flex;gap:8px}.chat{min-height:520px;display:flex;flex-direction:column}.messages{flex:1;padding:18px;overflow:auto;min-height:380px}.bubble{background:#f0eff3;padding:11px 14px;border-radius:17px;max-width:75%;margin:7px 0;word-break:break-word}.me{margin-left:auto;background:#ef3d72;color:#fff}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.compose input{flex:1;border:1px solid #ddd;border-radius:22px;padding:12px;font:inherit}.compose .primary{width:auto;padding:11px 18px}.nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:center;z-index:30}.nav button{border:0;background:none;color:#888;min-width:90px;cursor:pointer}.nav button.activeNav{color:#ef3d72;font-weight:700}.nav span{display:block;font-size:21px;margin-bottom:3px}.empty{padding:48px 20px;text-align:center;color:#888}.auth{max-width:520px;margin:55px auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;padding:12px;border:1px solid #ddd;background:#fff;border-radius:10px;cursor:pointer}.tabs button.sel{background:#fff0f4;color:#ef3d72;border-color:#ef3d72;font-weight:700}.msg{padding:10px 0;color:#df3f70;font-size:14px;line-height:1.4}.success{color:#168451}.hidden{display:none!important}.backline{display:flex;align-items:center;gap:10px;margin-bottom:22px}.backline h2{margin:0}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171827;color:#fff;padding:11px 16px;border-radius:20px;z-index:50;display:none}.toast.show{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{display:none}.photo{height:390px}.nav button{min-width:65px;font-size:12px}.top{padding:0 18px}.brand{font-size:25px}}
</style>
</head>
<body>
<header class="top"><div class="brand">♥ LoveConnect</div><button id="gear" aria-label="Settings" class="hidden">⚙️</button></header>
<main class="wrap">
<section id="auth" class="screen active"><div class="form auth"><div class="brand" style="text-align:center;margin-bottom:20px">♥ LoveConnect</div><div class="tabs"><button id="loginTab" class="sel">Login</button><button id="signupTab">Create account</button></div>
<div id="authLogin"><h2>Welcome back</h2><div class="field"><label>Email</label><input id="le" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">Login</button></div>
<div id="authSignup" class="hidden"><h2>Create your account</h2><div class="field"><label>Name</label><input id="sn" autocomplete="name"></div><div class="field"><label>Email</label><input id="se" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="sp" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Age</label><input id="sa" type="number" min="18"></div><div class="field"><label>Gender</label><select id="sg"><option>Man</option><option>Woman</option><option>Other</option></select></div><div class="field"><label>Looking for</label><select id="slf"><option>Women</option><option>Men</option><option>Everyone</option></select></div><div class="field"><label>Location</label><input id="sl" placeholder="Ajman"></div><div class="field"><label>About me</label><textarea id="sb"></textarea></div><div class="field"><label>Interests</label><input id="si" placeholder="Travel, music, movies"></div><button id="signupBtn" class="primary">Create Account</button></div><div id="authMsg" class="msg"></div></div></section>

<section id="explore" class="screen"><div class="grid"><div><div class="location">📍 <b id="myLocTop">Your location</b></div><div id="exploreCard"></div></div><div class="side"><div class="card feature"><h3>LoveConnect</h3><p class="muted">Explore real profiles, like people, match and chat.</p></div><div class="card feature"><h3>Your activity</h3><p class="muted" id="activityText">Your real likes, profile views and chats will appear here.</p></div></div></div></section>
<section id="viewed" class="screen"><div class="list"><div class="list-head"><h2>Viewed by</h2><b id="viewCount">0</b></div><div id="viewedList"></div></div></section>
<section id="liked" class="screen"><div class="list"><div class="list-head"><h2>Liked you</h2><b id="likeCount">0</b></div><div id="likedList"></div></div></section>
<section id="chats" class="screen"><div class="list"><div class="list-head"><h2>Chats</h2></div><div id="chatList"></div></div></section>
<section id="chatroom" class="screen"><div class="list chat"><div class="list-head"><button id="chatBack" class="secondary">←</button><b id="chatName">Chat</b></div><div id="messages" class="messages"></div><div class="compose"><input id="message" placeholder="Type a message"><button id="sendBtn" class="primary">Send</button></div></div></section>
<section id="profile" class="screen"><div class="form" style="text-align:center"><div class="avatar" style="margin:auto" id="myAvatar">M</div><h2 id="myName">Profile</h2><p class="muted" id="myLocation"></p><p class="bio" id="myBio"></p><button id="editProfileBtn" class="secondary">Edit Profile</button></div></section>
<section id="edit" class="screen"><form id="editForm" class="form"><div class="backline"><button type="button" id="editBack" class="secondary">← Back</button><h2>Edit Profile</h2></div><div class="field"><label>Name</label><input id="en" required></div><div class="field"><label>Age</label><input id="ea" type="number" min="18" required></div><div class="field"><label>Gender</label><input id="eg"></div><div class="field"><label>Looking for</label><input id="elf"></div><div class="field"><label>Location</label><input id="el" required></div><div class="field"><label>About me</label><textarea id="eb"></textarea></div><div class="field"><label>Interests</label><input id="ei"></div><button class="primary">Save Profile</button><div id="editMsg" class="msg"></div></form></section>
<section id="settings" class="screen"><div class="list settings"><div class="list-head"><h2>Settings</h2><div class="setting-actions"><button id="settingsBack" class="secondary">← Back</button><button id="settingsClose" class="secondary" aria-label="Close">✕</button></div></div><button class="row settingBtn" data-setting="account">Account <span>›</span></button><button class="row settingBtn" data-setting="notifications">Notifications <span>›</span></button><button class="row settingBtn" data-setting="privacy">Privacy &amp; Safety <span>›</span></button><button class="row settingBtn" data-setting="help">Help &amp; Support <span>›</span></button><div class="row"><button id="logoutBtn" class="secondary">Logout</button></div></div></section>
<section id="settingDetail" class="screen"><div class="form"><div class="backline"><button id="detailBack" class="secondary">← Back</button><h2 id="settingTitle"></h2></div><div id="settingBody" class="bio"></div></div></section>
</main>
<nav id="nav" class="nav hidden"><button data-s="explore"><span>◈</span>Explore</button><button data-s="viewed"><span>♧</span>Viewed by</button><button data-s="chats"><span>💬</span>Chats</button><button data-s="liked"><span>♡</span>Liked you</button><button data-s="profile"><span>♙</span>Profile</button></nav><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://deiwduvfskhqfzjpzyha.supabase.co';
const SUPABASE_KEY='sb_publishable_ccXAv4AC1GPc2Bo795yfhQ_E8c0rypY';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,profiles=[],currentIndex=0,currentChatUser=null,realtime=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('activeNav',b.dataset.s===id));if(id==='viewed')loadViewed();if(id==='liked')loadLiked();if(id==='chats')loadChats();if(id==='profile')loadMe();}
function showAuth(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('auth').classList.add('active');$('nav').classList.add('hidden');$('gear').classList.add('hidden')}
function authMode(mode){$('authLogin').classList.toggle('hidden',mode!=='login');$('authSignup').classList.toggle('hidden',mode!=='signup');$('loginTab').classList.toggle('sel',mode==='login');$('signupTab').classList.toggle('sel',mode==='signup');$('authMsg').textContent=''}
async function login(){const email=$('le').value.trim(),password=$('lp').value;if(!email||!password){$('authMsg').textContent='Enter email and password.';return}$('loginBtn').disabled=true;$('authMsg').textContent='Signing in...';const {data,error}=await sb.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error){$('authMsg').textContent=error.message;return}await boot(data.session)}
async function signup(){const msg=$('authMsg');const name=$('sn').value.trim(),email=$('se').value.trim(),password=$('sp').value,age=Number($('sa').value),gender=$('sg').value,looking_for=$('slf').value,location=$('sl').value.trim(),about=$('sb').value.trim(),interests=$('si').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!email||!password||age<18||!location){msg.textContent='Please complete the required fields. Age must be 18 or older.';return}$('signupBtn').disabled=true;msg.textContent='Creating account...';const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,age,gender,looking_for,location,about,interests}}});$('signupBtn').disabled=false;if(error){msg.textContent=error.message;return}if(data.session){me=data.session.user;await ensureProfile({name,age,gender,looking_for,location,about,interests});await boot(data.session)}else{msg.innerHTML='<span class="success">Account created. You can now login without email verification.</span>'}}
async function ensureProfile(values={}){if(!me)return;const {data}=await sb.from('profiles').select('id').eq('id',me.id).maybeSingle();if(data)return;const m=me.user_metadata||{};const payload={id:me.id,name:values.name??m.name??'',age:Number(values.age??m.age??18),gender:values.gender??m.gender??'',looking_for:values.looking_for??m.looking_for??'',location:values.location??m.location??'',about:values.about??m.about??'',interests:Array.isArray(values.interests)?values.interests:(Array.isArray(m.interests)?m.interests:[])};const {error}=await sb.from('profiles').insert(payload);if(error)console.error(error)}
async function boot(session){if(!session){const r=await sb.auth.getSession();session=r.data.session}if(!session){showAuth();return}me=session.user;await ensureProfile();await loadMe();await loadExplore();$('nav').classList.remove('hidden');$('gear').classList.remove('hidden');show('explore');subscribeMessages()}
async function loadMe(){const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();window.meProfile=data||{};const p=window.meProfile;$('myName').textContent=p.name||'Your Profile';$('myLocation').textContent=p.location||'';$('myBio').textContent=p.about||'';$('myAvatar').textContent=(p.name||'M').charAt(0).toUpperCase();$('myLocTop').textContent=p.location||'Your location';}
async function loadExplore(){const {data,error}=await sb.from('profiles').select('*').neq('id',me.id).order('created_at',{ascending:false});if(error){$('exploreCard').innerHTML='<div class="card empty">'+esc(error.message)+'</div>';return}profiles=data||[];currentIndex=0;renderExplore()}
function renderExplore(){if(currentIndex>=profiles.length){$('exploreCard').innerHTML='<div class="card empty"><h3>No more profiles</h3><p>New members will appear here when profiles are available.</p></div>';return}const p=profiles[currentIndex];$('exploreCard').innerHTML=`<div class="card"><div class="photo"><div class="avatar">${esc((p.name||'?').charAt(0).toUpperCase())}</div></div><div class="info"><div class="name">${esc(p.name||'Member')}${p.age?', '+esc(p.age):''}</div><div class="muted">${esc(p.location||'')}</div><div class="online">● Member</div><div class="bio">${esc(p.about||'')}</div>${p.interests?.length?'<p class="muted">'+esc(p.interests.join(' • '))+'</p>':''}</div><div class="actions"><button class="round" id="passBtn" aria-label="Skip">✕</button><button class="round like" id="likeBtn" aria-label="Like">♥</button></div></div>`;viewProfile(p.id);$('passBtn').onclick=()=>{currentIndex++;renderExplore()};$('likeBtn').onclick=()=>likeProfile(p.id)}
async function viewProfile(id){if(!me||id===me.id)return;await sb.from('profile_views').upsert({viewer_id:me.id,viewed_id:id},{onConflict:'viewer_id,viewed_id',ignoreDuplicates:true})}
async function likeProfile(id){const {error}=await sb.from('likes').upsert({liker_id:me.id,liked_id:id},{onConflict:'liker_id,liked_id',ignoreDuplicates:true});if(error){toast(error.message);return}toast('Liked ♥');currentIndex++;renderExplore()}
async function loadViewed(){const {data,error}=await sb.from('profile_views').select('viewer_id,created_at').eq('viewed_id',me.id).order('created_at',{ascending:false});if(error){$('viewedList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const ids=(data||[]).map(x=>x.viewer_id);$('viewCount').textContent=ids.length;await renderPeopleByIds('viewedList',ids,'Viewed you')}
async function loadLiked(){const {data,error}=await sb.from('likes').select('liker_id,created_at').eq('liked_id',me.id).order('created_at',{ascending:false});if(error){$('likedList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const ids=(data||[]).map(x=>x.liker_id);$('likeCount').textContent=ids.length;await renderPeopleByIds('likedList',ids,'Liked you')}
async function renderPeopleByIds(el,ids,label){if(!ids.length){$(el).innerHTML='<div class="empty">No '+label.toLowerCase()+' activity yet.</div>';return}const {data,error}=await sb.from('profiles').select('*').in('id',ids);if(error){$(el).innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const map=new Map((data||[]).map(x=>[x.id,x]));$(el).innerHTML=ids.map(id=>{const p=map.get(id);if(!p)return '';return `<div class="person click" data-chat="${esc(p.id)}"><div class="miniavatar">${esc((p.name||'?')[0].toUpperCase())}</div><div class="details"><b>${esc(p.name||'Member')}${p.age?', '+esc(p.age):''}</b><small>${esc(p.location||'')}</small></div>${label==='Liked you'?'<span class="heart">♥</span>':'<button class="mini">Chat</button>'}</div>`}).join('')||'<div class="empty">No activity yet.</div>';$(el).querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>startChat(x.dataset.chat))}
async function loadChats(){const {data,error}=await sb.from('messages').select('*').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:false});if(error){$('chatList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const map=new Map();(data||[]).forEach(m=>{const other=m.sender_id===me.id?m.receiver_id:m.sender_id;if(!map.has(other))map.set(other,m)});const ids=[...map.keys()];if(!ids.length){$('chatList').innerHTML='<div class="empty">No chats yet. When you have messages, they will appear here.</div>';return}const {data:ps}=await sb.from('profiles').select('*').in('id',ids);const pm=new Map((ps||[]).map(x=>[x.id,x]));$('chatList').innerHTML=ids.map(id=>{const p=pm.get(id),m=map.get(id);return `<div class="person click" data-chat="${esc(id)}"><div class="miniavatar">${esc((p?.name||'?')[0].toUpperCase())}</div><div class="details"><b>${esc(p?.name||'Member')}</b><small>${esc(m.body)}</small></div><small>${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small></div>`}).join('');$('chatList').querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>startChat(x.dataset.chat))}
async function startChat(id){currentChatUser=id;const {data:p}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();$('chatName').textContent=p?.name||'Chat';await loadMessages();show('chatroom')}
async function loadMessages(){if(!currentChatUser)return;const {data,error}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${me.id})`).order('created_at',{ascending:true});if(error){$('messages').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}$('messages').innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'me':''}">${esc(m.body)}</div>`).join('')||'<div class="empty">Start the conversation.</div>';$('messages').scrollTop=$('messages').scrollHeight}
async function send(){const body=$('message').value.trim();if(!body||!currentChatUser)return;const {error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:currentChatUser,body});if(error){toast(error.message);return}$('message').value='';await loadMessages()}
function subscribeMessages(){if(realtime)sb.removeChannel(realtime);realtime=sb.channel('loveconnect-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{if(currentChatUser&&(payload.new.sender_id===currentChatUser||payload.new.receiver_id===currentChatUser))loadMessages()}).subscribe()}
function openSettings(){if(!me)return;show('settings')}
function closeSettings(){show('explore')}
function showSetting(type){const d={account:['Account','Your LoveConnect account is managed securely through Supabase.'],notifications:['Notifications','Notification preferences will appear here when notification controls are enabled.'],privacy:['Privacy & Safety','Your profile activity and messages are protected by database security policies. Never share your password with another person.'],help:['Help & Support','For now, use the Back button to return to Settings.']};const item=d[type];if(!item)return;$('settingTitle').textContent=item[0];$('settingBody').textContent=item[1];show('settingDetail')}
function fillEdit(){const p=window.meProfile||{};$('en').value=p.name||'';$('ea').value=p.age||'';$('eg').value=p.gender||'';$('elf').value=p.looking_for||'';$('el').value=p.location||'';$('eb').value=p.about||'';$('ei').value=(p.interests||[]).join(', ')}
async function saveProfile(e){e.preventDefault();const payload={name:$('en').value.trim(),age:Number($('ea').value),gender:$('eg').value.trim(),looking_for:$('elf').value.trim(),location:$('el').value.trim(),about:$('eb').value.trim(),interests:$('ei').value.split(',').map(x=>x.trim()).filter(Boolean)};const {error}=await sb.from('profiles').update(payload).eq('id',me.id);if(error){$('editMsg').textContent=error.message;return}await loadMe();await loadExplore();show('profile');toast('Profile saved')}
async function logout(){await sb.auth.signOut();me=null;profiles=[];window.meProfile=null;showAuth();authMode('login')}
$('loginTab').onclick=()=>authMode('login');$('signupTab').onclick=()=>authMode('signup');$('loginBtn').onclick=login;$('signupBtn').onclick=signup;$('gear').onclick=openSettings;$('settingsBack').onclick=closeSettings;$('settingsClose').onclick=closeSettings;$('detailBack').onclick=()=>show('settings');$('chatBack').onclick=()=>show('chats');$('sendBtn').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('editProfileBtn').onclick=()=>{fillEdit();show('edit')};$('editBack').onclick=()=>show('profile');$('editForm').onsubmit=saveProfile;$('logoutBtn').onclick=logout;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));document.querySelectorAll('.settingBtn').forEach(b=>b.onclick=()=>showSetting(b.dataset.setting));
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showAuth()});
(async()=>{const {data}=await sb.auth.getSession();if(data.session)await boot(data.session);else showAuth()})();
</script>
</body></html>
