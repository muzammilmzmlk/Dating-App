<body>
<header class="top"><div class="brand">♥ LoveConnect</div><button id="gear" aria-label="Settings" class="hidden">⚙️</button></header>
<main class="wrap">
<section id="auth" class="screen active"><div class="form auth"><div class="brand" style="text-align:center;margin-bottom:20px">♥ LoveConnect</div><div class="tabs"><button id="loginTab" class="sel">Login</button><button id="signupTab">Create account</button></div>
<div id="authLogin"><h2>Welcome back</h2><div class="field"><label>Email</label><input id="le" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">Login</button></div>
<div id="authSignup" class="hidden"><h2>Create your account</h2><div class="field"><label>Name</label><input id="sn" autocomplete="name"></div><div class="field"><label>Email</label><input id="se" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="sp" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Age</label><input id="sa" type="number" min="18"></div><div class="field"><label>Gender</label><select id="sg"><option>Man</option><option>Woman</option><option>Other</option></select></div><div class="field"><label>Looking for</label><select id="slf"><option>Women</option><option>Men</option><option>Everyone</option></select></div><div class="field"><label>Location</label><input id="sl" placeholder="Ajman"></div><div class="field"><label>About me</label><textarea id="sb"></textarea></div><div class="field"><label>Interests</label><input id="si" placeholder="Travel, music, movies"></div><button id="signupBtn" class="primary">Create Account</button></div><div id="authMsg" class="msg"></div></div></section>

<section id="explore" class="screen"><div style="max-width:760px;margin:auto"><div class="location"><div class="locationRow"><span>📍</span><input id="locationSearch" type="search" placeholder="Search by location"><button id="locationSearchBtn">Search</button></div><div class="searchHint">Your location: <b id="myLocTop">Not set</b></div></div><p class="swipeHelp">Swipe right to like • Swipe left to pass</p><div id="exploreCard"></div></div></section>
<section id="viewed" class="screen"><div class="list"><div class="list-head"><h2>Viewed by</h2><b id="viewCount">0</b></div><div id="viewedList"></div></div></section>
<section id="liked" class="screen"><div class="list"><div class="list-head"><h2>Liked you</h2><b id="likeCount">0</b></div><div id="likedList"></div></div></section>
<section id="chats" class="screen"><div class="list"><div class="list-head"><h2>Chats</h2></div><div id="chatList"></div></div></section>
<section id="chatroom" class="screen"><div class="list chat"><div class="list-head"><button id="chatBack" class="secondary">←</button><b id="chatName">Chat</b></div><div id="messages" class="messages"></div><div class="compose"><input id="message" placeholder="Type a message"><button id="sendBtn" class="primary">Send</button></div></div></section>
<section id="profile" class="screen"><div class="form"><div style="text-align:center"><div class="avatar" style="margin:auto" id="myAvatar">M</div><div id="myPhotoGallery" class="photoGrid" style="margin:18px 0;display:none"></div><h2 id="myName">Profile</h2><p class="muted" id="myLocation"></p></div><div id="myProfileDetails" class="detailList"></div><button id="editProfileBtn" class="primary" style="margin-top:20px">Edit Profile</button></div></section>
<section id="profileView" class="screen"><div class="profileViewer card"><div class="profileViewerHead"><h2 id="profileViewTitle">Profile</h2><button id="profileViewClose" class="secondary" type="button">✕ Close</button></div><div id="profileViewContent"></div></div></section>
<section id="edit" class="screen"><form id="editForm" class="form"><div class="backline"><button type="button" id="editBack" class="secondary">← Back</button><h2>Edit Profile</h2></div><div class="field"><label>Name</label><input id="en" required></div><div class="field"><label>Age</label><input id="ea" type="number" min="18" required></div><div class="field"><label>Gender</label><select id="eg"><option value="Man">Man</option><option value="Woman">Woman</option><option value="Other">Other</option></select></div><div class="field"><label>Looking for</label><select id="elf"><option value="Women">Women</option><option value="Men">Men</option><option value="Everyone">Everyone</option></select></div><div class="field"><label>Location</label><input id="el" required></div><div class="field"><label>About me</label><textarea id="eb"></textarea></div><div class="field"><label>Interests</label><input id="ei"></div><div class="photoManager"><h3>Profile Photos</h3><p class="photoHint">Add up to 5 photos: 1 main profile photo + 4 extra photos.</p><div id="photoGrid" class="photoGrid"></div><div id="uploadMsg" class="uploadMsg"></div></div><button class="primary">Save Profile</button><div id="editMsg" class="msg"></div></form></section>
<section id="settings" class="screen"><div class="list settings"><div class="list-head"><h2>Settings</h2></div><button class="row settingBtn" data-setting="account">Account <span>›</span></button><button class="row settingBtn" data-setting="notifications">Notifications <span>›</span></button><button class="row settingBtn" data-setting="privacy">Privacy &amp; Safety <span>›</span></button><button class="row settingBtn" data-setting="help">Help &amp; Support <span>›</span></button><div class="row"><button id="logoutBtn" class="secondary">Logout</button></div></div></section>
<section id="settingDetail" class="screen"><div class="form"><div class="backline"><button id="detailBack" class="secondary">← Settings</button><h2 id="settingTitle"></h2></div><div id="settingBody" class="bio"></div></div></section>
</main>

<script>

async function withTimeout(promise,ms,label){let timer;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' timed out. Please check your internet connection and try again.')),ms)});try{return await Promise.race([promise,timeout])}finally{clearTimeout(timer)}}
async function login(){const email=$('le').value.trim(),password=$('lp').value;if(!email||!password){$('authMsg').textContent='Enter email and password.';return}$('loginBtn').disabled=true;$('authMsg').textContent='Signing in...';try{const result=await withTimeout(sb.auth.signInWithPassword({email,password}),15000,'Sign in');const {data,error}=result;if(error)throw error;if(!data?.session)throw new Error('Login completed but no session was returned. Please try again.');$('authMsg').textContent='Loading profile...';await boot(data.session);$('authMsg').textContent=''}catch(err){console.error('Login error:',err);$('authMsg').textContent=err?.message||'Unable to sign in. Please check your email and password.'}finally{$('loginBtn').disabled=false}}

async function boot(session){if(booting)return;if(!session){const r=await withTimeout(sb.auth.getSession(),10000,'Session check');session=r.data.session}if(!session){showAuth();return}booting=true;try{me=session.user;$('authMsg').textContent='Loading profile...';await withTimeout(ensureProfile(),10000,'Profile load');await withTimeout(loadMe(),10000,'Profile load');await withTimeout(loadExplore(),10000,'Explore load');$('nav').classList.remove('hidden');$('gear').classList.remove('hidden');show('explore');subscribeMessages()}catch(err){console.error('App startup error:',err);$('authMsg').textContent='Signed in, but loading the app failed: '+(err?.message||'unknown error')}finally{booting=false}}
async function loadMe(){const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();window.meProfile=data||{};const p=window.meProfile;$('myName').textContent=p.name||'Your Profile';$('myLocation').textContent=p.location||'';renderAvatar('myAvatar',p);renderMyGallery(p);$('myLocTop').textContent=p.location||'Not set';renderMyProfileDetails(p)}
function renderMyProfileDetails(p){const rows=[];if(p.about)rows.push(`<div class="detailItem"><b>About me</b>${esc(p.about)}</div>`);if(p.age)rows.push(`<div class="detailItem"><b>Age</b>${esc(p.age)}</div>`);if(p.gender)rows.push(`<div class="detailItem"><b>Gender</b>${esc(p.gender)}</div>`);if(p.location)rows.push(`<div class="detailItem"><b>Location</b>${esc(p.location)}</div>`);if(Array.isArray(p.interests)&&p.interests.length)rows.push(`<div class="detailItem"><b>Interests</b><div class="detailTags">${p.interests.map(x=>`<span class="detailTag">${esc(x)}</span>`).join('')}</div></div>`);$('myProfileDetails').innerHTML=rows.join('')||'<div class="empty">Add your profile details from Edit Profile.</div>'}
async function getBlockedIds(){if(!me)return new Set();const {data}=await sb.from('blocks').select('blocked_id').eq('blocker_id',me.id);return new Set((data||[]).map(x=>x.blocked_id))}
async function loadExplore(){
  const {data:meData}=await sb.from('profiles').select('looking_for').eq('id',me.id).maybeSingle();
  const lookingFor=String(meData?.looking_for||window.meProfile?.looking_for||me?.user_metadata?.looking_for||'Everyone').trim().toLowerCase();
  const {data,error}=await sb.from('profiles').select('*').neq('id',me.id).order('created_at',{ascending:false});
  if(error){$('exploreCard').innerHTML='<div class="card empty">'+esc(error.message)+'</div>';return}
  const genderOf=p=>String(p?.gender||'').trim().toLowerCase();
  const blocked=await getBlockedIds();
  profiles=(data||[]).filter(p=>{
    if(blocked.has(p.id)) return false;
    if(p.show_in_explore===false) return false;
    if(lookingFor==='men'||lookingFor==='man') return ['man','male'].includes(genderOf(p));
    if(lookingFor==='women'||lookingFor==='woman') return ['woman','female'].includes(genderOf(p));
    return ['man','male','woman','female','other'].includes(genderOf(p));
  });
  applyLocationSearch(false)
}
function applyLocationSearch(reset=true){locationQuery=$('locationSearch')?.value.trim()||'';filteredProfiles=locationQuery?profiles.filter(p=>String(p.location||'').toLowerCase().includes(locationQuery.toLowerCase())):profiles.slice();if(reset)currentIndex=0;else currentIndex=Math.min(currentIndex,Math.max(filteredProfiles.length-1,0));renderExplore()}
async function viewProfile(id){
  if(!me || !id || id===me.id) return;
  try{
    const {error}=await sb.from('profile_views').upsert(
      {viewer_id:me.id, viewed_id:id},
      {onConflict:'viewer_id,viewed_id', ignoreDuplicates:true}
    );
    if(error) console.warn('Profile view could not be recorded:', error);
  }catch(err){
    console.warn('Profile view error:', err);
  }
}
function renderExplore(){
  if(currentIndex>=filteredProfiles.length){
    const text=locationQuery?`No profiles found in “${esc(locationQuery)}”.`:'No more profiles';
    $('exploreCard').innerHTML=`<div class="card empty"><h3>${text}</h3><p>${locationQuery?'Try another location or clear the search.':'New members will appear here when profiles are available.'}</p></div>`;

  }

  $('exploreCard').innerHTML=`<div class="card swipeCard" id="swipeCard" role="button" tabindex="0" aria-label="Open ${esc(p.name||'profile')} profile"><span class="swipeLabel likeLabel" id="likeLabel">INTERESTED ♥</span><span class="swipeLabel passLabel" id="passLabel">PASS ✕</span><div class="photo ${photos.length?'hasImage':''} ${photos.length>1?'hasMultiple':''}">${photoMarkup}${photos.length?`<span class="photoCount">${photos.length} photo${photos.length>1?'s':''}</span>`:''}</div><div class="info"><div class="name">${esc(p.name||'Member')}${p.age?', '+esc(p.age):''}</div><div class="online">● Member</div>${p.location?`<div class="muted">📍 ${esc(p.location)}</div>`:''}<div class="profileFullDetails exploreDetails">${profileDetailsMarkup(p)}</div></div></div><div class="exploreActions"><button class="round" id="passBtn" aria-label="Not interested" title="Not interested">✕</button><button class="round like" id="likeBtn" aria-label="Interested" title="Interested">♥</button></div>`;
  $('passBtn').onclick=e=>{e.stopPropagation();passProfile()};
  $('likeBtn').onclick=e=>{e.stopPropagation();likeProfile(p.id)};
  setupProfileSwipe();

  if(photos.length>1){
    const carousel=$('photoCarousel'),dots=[...$('photoDots').children];
    const goTo=i=>{const idx=Math.max(0,Math.min(i,photos.length-1));carousel.scrollTo({left:idx*carousel.clientWidth,behavior:'smooth'})};
    $('photoPrev').onclick=e=>{e.stopPropagation();goTo(Math.round(carousel.scrollLeft/carousel.clientWidth)-1)};
    $('photoNext').onclick=e=>{e.stopPropagation();goTo(Math.round(carousel.scrollLeft/carousel.clientWidth)+1)};
    carousel.addEventListener('scroll',()=>{const idx=Math.round(carousel.scrollLeft/carousel.clientWidth);dots.forEach((d,i)=>d.classList.toggle('active',i===idx));},{passive:true});
    let startX=0,startScroll=0;
    carousel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startScroll=carousel.scrollLeft},{passive:true});
    carousel.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;const threshold=45;const idx=Math.round(startScroll/carousel.clientWidth);if(Math.abs(dx)>=threshold)goTo(idx+(dx<0?1:-1))},{passive:true});
    setTimeout(()=>{const hint=document.querySelector('.photoSwipeHint');if(hint)setTimeout(()=>hint.remove(),2200)},1200);
  }

  const card=$('swipeCard');
  if(card){
    let moved=false;
    card.addEventListener('pointerdown',()=>{moved=false});
    card.addEventListener('pointermove',()=>{moved=true});
    card.addEventListener('click',e=>{
      if(moved || e.target.closest('.actions,.photoCarousel,.photoArrow,button')) return;
      openProfileView(p,'explore');
    });
    card.addEventListener('keydown',e=>{
      if(e.key==='Enter' || e.key===' '){e.preventDefault();openProfileView(p,'explore')}
    });
  }
}
function passProfile(){currentIndex++;renderExplore()}
function setupProfileSwipe(){
  const card=$('swipeCard'); if(!card)return;
  let startX=0,startY=0,dx=0,dragging=false,activePointer=null,raf=0,pendingX=0,pendingY=0;
  const likeLabel=$('likeLabel'), passLabel=$('passLabel');
  const reset=()=>{
    if(raf)cancelAnimationFrame(raf);
    raf=0; card.classList.remove('dragging'); card.style.transform=''; card.style.opacity='1';
    likeLabel.style.opacity=0; passLabel.style.opacity=0;
  };
  const paint=()=>{
    raf=0;
    const x=pendingX,y=pendingY,dy=y-startY;
    if(Math.abs(x)<8 || Math.abs(x)<Math.abs(dy)) return;
    dragging=true; card.classList.add('dragging');
    const rotation=Math.max(-8,Math.min(8,x/22));
    card.style.transform=`translate3d(${x}px,0,0) rotate(${rotation}deg)`;
    card.style.opacity=String(Math.max(.82,1-Math.abs(x)/700));
    const amount=Math.min(1,Math.abs(x)/110);
    likeLabel.style.opacity=x>0?String(amount):0;
    passLabel.style.opacity=x<0?String(amount):0;
  };
  const move=(x,y)=>{
    pendingX=x-startX; pendingY=y;
    if(!raf)raf=requestAnimationFrame(paint);
  };
  const finish=()=>{
    if(raf)cancelAnimationFrame(raf); raf=0;
    if(!dragging){reset();startX=0;startY=0;dx=0;activePointer=null;return}
    const threshold=90;
    const targetId=filteredProfiles[currentIndex]?.id;
    const liked=dx>0;
    if(Math.abs(dx)>=threshold){
      card.classList.remove('dragging');
      card.style.transition='transform .20s cubic-bezier(.22,.61,.36,1),opacity .18s ease';
      card.style.transform=`translate3d(${liked?'115%':'-115%'},0,0) rotate(${liked?7:-7}deg)`;
      card.style.opacity='0';
      window.setTimeout(()=>{if(liked&&targetId)likeProfile(targetId);else passProfile()},190);
    }else{
      card.classList.remove('dragging');
      card.style.transition='transform .18s cubic-bezier(.22,.61,.36,1),opacity .16s ease';
      card.style.transform='translate3d(0,0,0) rotate(0deg)';
      card.style.opacity='1';
      likeLabel.style.opacity=0; passLabel.style.opacity=0;
    }
    dragging=false;startX=0;startY=0;dx=0;activePointer=null;
  };
  card.addEventListener('pointerdown',e=>{
    if(e.target.closest('.photoCarousel,.photoArrow,button'))return;
    startX=e.clientX;startY=e.clientY;dx=0;dragging=false;activePointer=e.pointerId;
    card.setPointerCapture?.(e.pointerId);
    card.style.transition='none';
  });
  card.addEventListener('pointermove',e=>{
    if(activePointer!==e.pointerId)return;
    dx=e.clientX-startX;
    move(e.clientX,e.clientY);
  },{passive:true});
  card.addEventListener('pointerup',e=>{if(activePointer===e.pointerId)finish()});
  card.addEventListener('pointercancel',e=>{
    if(activePointer!==e.pointerId)return;
    dragging=false;dx=0;reset();startX=0;startY=0;activePointer=null;
  });
}
async function likeProfile(id){const {error}=await sb.from('likes').upsert({liker_id:me.id,liked_id:id,status:'pending'},{onConflict:'liker_id,liked_id',ignoreDuplicates:true});if(error){toast(error.message);return}const mutual=await isMutualLike(id);toast(mutual?'It’s a match! You can chat now ♥':'Liked ♥');currentIndex++;renderExplore();if($('liked').classList.contains('active'))loadLiked()}
async function isMutualLike(otherId){
  if(!me||!otherId)return false;
  const {data,error}=await sb.from('likes').select('liker_id,liked_id,status')
    .or(`and(liker_id.eq.${me.id},liked_id.eq.${otherId}),and(liker_id.eq.${otherId},liked_id.eq.${me.id})`);
  if(error)return false;
  const mine=(data||[]).find(x=>x.liker_id===me.id&&x.liked_id===otherId);
  const theirs=(data||[]).find(x=>x.liker_id===otherId&&x.liked_id===me.id);
  return mine?.status==='accepted'&&theirs?.status==='accepted';
}
async function loadViewed(){const blocked=await getBlockedIds();const {data,error}=await sb.from('profile_views').select('viewer_id,created_at').eq('viewed_id',me.id).order('created_at',{ascending:false});if(error){$('viewedList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const ids=[...new Set((data||[]).map(x=>x.viewer_id).filter(id=>!blocked.has(id)))];$('viewCount').textContent=ids.length;await renderPeopleByIds('viewedList',ids,'Viewed you')}
async function loadLiked(){

    .select('liker_id,created_at,status')

async function renderPeopleByIds(el,ids,label,statusMap=new Map()){
  if(!ids.length){$(el).innerHTML='<div class="empty">No '+label.toLowerCase()+' activity yet.</div>';return}
  const {data,error}=await sb.from('profiles').select('*').in('id',ids);
  if(error){$(el).innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
  const {data:incoming}=await sb.from('likes').select('liker_id,status').eq('liked_id',me.id).in('liker_id',ids);
  const {data:mineLikes}=await sb.from('likes').select('liked_id,status').eq('liker_id',me.id).in('liked_id',ids);
  const incomingMap=new Map((incoming||[]).map(x=>[x.liker_id,x.status||'pending']));
  const mineMap=new Map((mineLikes||[]).map(x=>[x.liked_id,x.status||'pending']));
  const map=new Map((data||[]).map(x=>[x.id,x]));
  $(el).innerHTML=ids.map(id=>{
    const p=map.get(id); if(!p)return '';
    const incomingStatus=statusMap.get(id)||incomingMap.get(id)||'pending';
    const mineStatus=mineMap.get(id)||'pending';
    const mutual=incomingStatus==='accepted'&&mineStatus==='accepted';
    const photo=(p.photo_urls||[])[0]||'';
    const avatar=photo?`<img src="${esc(photo)}" alt="">`:esc((p.name||'?')[0].toUpperCase());
    let action='';
    let statusNote='';
    if(label==='Liked you'){
      if(incomingStatus==='pending'){
        action=`<div class="interestActions"><button class="mini acceptBtn" type="button" data-accept="${esc(p.id)}">Accept ♥</button><button class="mini declineBtn" type="button" data-decline="${esc(p.id)}">Decline</button></div>`;
      }else if(incomingStatus==='accepted'){
        statusNote='<div class="statusNote acceptedStatus">Accepted ✓</div>';
        if(mutual) action='<button class="mini" type="button" data-chat="'+esc(p.id)+'">Chat</button>';
      }else if(incomingStatus==='declined'){
        statusNote='<div class="statusNote declinedStatus">Declined</div>';
      }
    }
    if(mutual && label!=='Liked you') action='<button class="mini" type="button" data-chat="'+esc(p.id)+'">Chat</button>';
    return `<div class="person click" data-profile="${esc(p.id)}"><div class="miniavatar">${avatar}</div><div class="details"><b>${esc(p.name||'Member')}${p.age?', '+esc(p.age):''}</b><small>${esc(p.location||'')}</small>${statusNote}</div>${action}</div>`;
  }).join('')||'<div class="empty">No activity yet.</div>';

  $(el).querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>{
    openProfileView(map.get(x.dataset.profile),el==='viewedList'?'viewed':'liked')
  });
  $(el).querySelectorAll('[data-chat]').forEach(x=>{
    x.onclick=e=>{e.stopPropagation();startChat(x.dataset.chat)}
  });
  $(el).querySelectorAll('[data-accept]').forEach(x=>{
    x.onclick=async e=>{e.stopPropagation();await setInterestStatus(x.dataset.accept,'accepted')}
  });
  $(el).querySelectorAll('[data-decline]').forEach(x=>{
    x.onclick=async e=>{e.stopPropagation();await setInterestStatus(x.dataset.decline,'declined')}
  });
}

}

llLeft/c.clientWidth)-1);$('viewPhotoNext').onclick=()=>goTo(Math.round(c.scrollLeft/c.clientWidth)+1);c.addEventListener('scroll',()=>{const idx=Math.round(c.scrollLeft/c.clientWidth);dots.forEach((d,i)=>d.classList.toggle('active',i===idx))},{passive:true})}}

function openSettings(){if(!me)return;show('settings')}
function closeSettings(){show('explore')}
async function showSetting(type){if(type==='privacy'){const p=window.meProfile||{};$('settingTitle').textContent='Privacy & Safety';$('settingBody').innerHTML='<div class="privacyBox"><div class="switchRow"><div><b>Show me in Explore</b><div class="statusNote">Turn this off to hide your profile from new Explore matches.</div></div><input id="privacyExplore" type="checkbox"></div></div><div class="privacyBox" style="margin-top:12px"><b>Safety</b><div class="statusNote" style="margin-top:6px">Blocked profiles are hidden from Explore, Viewed by, Liked you and Chat.</div></div>';$('privacyExplore').checked=p.show_in_explore!==false;$('privacyExplore').onchange=async()=>{const enabled=$('privacyExplore').checked;const {error}=await sb.from('profiles').update({show_in_explore:enabled}).eq('id',me.id);if(error){$('privacyExplore').checked=!enabled;toast(error.message);return}window.meProfile.show_in_explore=enabled;toast(enabled?'Your profile is visible in Explore':'Your profile is hidden from Explore');};show('settingDetail');return}if(type==='account'){
$('settingTitle').textContent='Account';
$('settingBody').innerHTML=`<div class="privacyBox"><button class="row" id="changePasswordBtn" type="button">🔑 Change Password <span>›</span></button><button class="row" id="changeEmailBtn" type="button">📧 Change Email <span>›</span></button><button class="row" id="deleteAccountBtn" type="button" style="color:#c52d5e">🗑️ Delete Account <span>›</span></button></div><div id="accountMsg" class="msg"></div>`;
$('changePasswordBtn').onclick=async()=>{const password=prompt('Enter your new password (minimum 6 characters):');if(password===null)return;if(password.length<6){toast('Password must be at least 6 characters.');return}const confirmPassword=prompt('Confirm your new password:');if(confirmPassword!==password){toast('Passwords do not match.');return}const {error}=await sb.auth.updateUser({password});if(error){toast(error.message);return}toast('Password changed successfully.');};
$('changeEmailBtn').onclick=async()=>{const email=prompt('Enter your new email address:');if(email===null)return;const clean=email.trim();if(!clean||!clean.includes('@')){toast('Please enter a valid email address.');return}const {error}=await sb.auth.updateUser({email:clean});if(error){toast(error.message);return}toast('Email change request sent. Check your email if confirmation is required.');};
$('deleteAccountBtn').onclick=async()=>{const ok=confirm('Delete your LoveConnect account permanently? This cannot be undone.');if(!ok)return;const second=prompt('Type DELETE to confirm account deletion:');if(second!=='DELETE'){toast('Account deletion cancelled.');return}const {error}=await sb.rpc('delete_my_account');if(error){toast(error.message);return}try{await sb.auth.signOut()}finally{me=null;window.meProfile=null;showAuth();authMode('login');toast('Account deleted.');}};
show('settingDetail');return;
}
const d={notifications:['Notifications','Notification preferences will appear here when notification controls are enabled.'],help:['Help & Support','For now, use the Back button to return to Settings.']};const item=d[type];if(!item)return;$('settingTitle').textContent=item[0];$('settingBody').textContent=item[1];show('settingDetail')}
function fillEdit(){const p=window.meProfile||{},m=me?.user_metadata||{};$('en').value=p.name??m.name??'';$('ea').value=p.age??m.age??'';$('eg').value=p.gender??m.gender??'';$('elf').value=p.looking_for??m.looking_for??'';$('el').value=p.location??m.location??'';$('eb').value=p.about??m.about??'';$('ei').value=(Array.isArray(p.interests)?p.interests:(Array.isArray(m.interests)?m.interests:[])).join(', ');renderPhotoManager(p.photo_urls||[])}
function publicPhotoUrl(path){return sb.storage.from('profile-photos').getPublicUrl(path).data.publicUrl}
function renderAvatar(id,p){const el=$(id);const url=(p?.photo_urls||[])[0]||'';if(url){el.innerHTML=`<img src="${esc(url)}" alt="Profile photo">`}else{el.textContent=(p?.name||'M').charAt(0).toUpperCase()}}
function renderMyGallery(p){const urls=p?.photo_urls||[];const g=$('myPhotoGallery');if(!urls.length){g.style.display='none';g.innerHTML='';return}g.style.display='grid';g.innerHTML=urls.map((u,i)=>`<div class="photoSlot"><img src="${esc(u)}" alt="Photo ${i+1}"></div>`).join('')}
function renderPhotoManager(urls){const arr=Array.isArray(urls)?urls:[];$('photoGrid').innerHTML=Array.from({length:5},(_,i)=>{const u=arr[i]||'';return u?`<div class="photoSlot"><img src="${esc(u)}" alt="Photo ${i+1}"><button type="button" class="removePhoto" data-remove="${i}" aria-label="Remove photo">×</button></div>`:`<label class="photoSlot addSlot"><div class="slotLabel">${i===0?'Main photo':'Extra photo '+i}<br><strong>＋ Add photo</strong></div><input type="file" accept="image/jpeg,image/png,image/webp" data-photo="${i}"></label>`}).join('');$('photoGrid').querySelectorAll('[data-photo]').forEach(input=>input.addEventListener('change',e=>handlePhotoUpload(e,iFrom(input.dataset.photo))));$('photoGrid').querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>removePhoto(Number(btn.dataset.remove)))}
function iFrom(v){return Number(v)}
async function handlePhotoUpload(e,index){const file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Please choose JPG, PNG or WebP.');return}if(file.size>5*1024*1024){toast('Each photo must be 5 MB or smaller.');return}if(!me){toast('Please login again.');return}const p=window.meProfile||{};const urls=[...(p.photo_urls||[])];if(urls.length>=5){toast('Maximum 5 photos.');return}if(index>urls.length){index=urls.length}const localPreview=URL.createObjectURL(file);const previous=[...urls];urls[index]=localPreview;window.meProfile.photo_urls=urls;renderPhotoManager(urls);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);$('uploadMsg').textContent='Uploading photo...';try{const ext=(file.type.split('/')[1]||'jpg').toLowerCase();const path=`${me.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('profile-photos').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(error)throw error;const url=publicPhotoUrl(path);urls[index]=url;const {error:updateError}=await sb.from('profiles').update({photo_urls:urls}).eq('id',me.id);if(updateError){await sb.storage.from('profile-photos').remove([path]);throw updateError}window.meProfile.photo_urls=urls;renderPhotoManager(urls);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);await loadExplore();$('uploadMsg').textContent='Photo added successfully.'}catch(err){window.meProfile.photo_urls=previous;renderPhotoManager(previous);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);$('uploadMsg').textContent=err?.message||'Photo upload failed.'}finally{URL.revokeObjectURL(localPreview);setTimeout(()=>$('uploadMsg').textContent='',2200)}}
async function removePhoto(index){const urls=[...(window.meProfile?.photo_urls||[])];const url=urls[index];if(!url)return;const marker='/storage/v1/object/public/profile-photos/';const pos=url.indexOf(marker);const path=pos>=0?decodeURIComponent(url.slice(pos+marker.length)):'';$('uploadMsg').textContent='Removing photo...';if(path)await sb.storage.from('profile-photos').remove([path]);urls.splice(index,1);const {error}=await sb.from('profiles').update({photo_urls:urls}).eq('id',me.id);if(error){$('uploadMsg').textContent=error.message;return}window.meProfile.photo_urls=urls;renderPhotoManager(urls);renderAvatar('myAvatar',window.meProfile);renderMyGallery(window.meProfile);await loadExplore();$('uploadMsg').textContent='Photo removed.';setTimeout(()=>$('uploadMsg').textContent='',1800)}
async function saveProfile(e){e.preventDefault();const payload={name:$('en').value.trim(),age:Number($('ea').value),gender:$('eg').value.trim(),looking_for:$('elf').value.trim(),location:$('el').value.trim(),about:$('eb').value.trim(),interests:$('ei').value.split(',').map(x=>x.trim()).filter(Boolean),photo_urls:window.meProfile?.photo_urls||[]};const {error}=await sb.from('profiles').update(payload).eq('id',me.id);if(error){$('editMsg').textContent=error.message;return}await loadMe();await loadExplore();show('profile');toast('Profile saved')}
async function logout(){try{await sb.auth.signOut()}finally{me=null;profiles=[];window.meProfile=null;['le','lp'].forEach(id=>{const el=$(id);if(el)el.value='' });$('authMsg').textContent='';showAuth();authMode('login')}}
$('loginTab').onclick=()=>authMode('login');$('locationSearchBtn').onclick=()=>applyLocationSearch(true);$('locationSearch').addEventListener('input',()=>applyLocationSearch(true));$('locationSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyLocationSearch(true)}});$('signupTab').onclick=()=>authMode('signup');$('loginBtn').onclick=login;$('signupBtn').onclick=signup;$('gear').onclick=toggleSettings;const bind=(id,event,fn)=>{const el=$(id);if(el)el.addEventListener(event,fn)};bind('detailBack','click',()=>show('settings'));bind('profileViewClose','click',closeProfileView);bind('chatBack','click',()=>show('chats'));bind('sendBtn','click',send);bind('message','keydown',e=>{if(e.key==='Enter')send()});bind('editProfileBtn','click',()=>{fillEdit();show('edit')});bind('editBack','click',()=>show('profile'));bind('editForm','submit',saveProfile);bind('logoutBtn','click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s)));document.querySelectorAll('.settingBtn').forEach(b=>b.addEventListener('click',()=>showSetting(b.dataset.setting)));
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){me=null;window.meProfile=null;showAuth()}else if(event==='INITIAL_SESSION'&&session&&!me){boot(session)}else if(event==='SIGNED_IN'&&session&&!me&&!booting){boot(session)}});
(async()=>{const {data}=await sb.auth.getSession();if(data.session){await boot(data.session)}else{showAuth()}})();
</script>
</body></html>
