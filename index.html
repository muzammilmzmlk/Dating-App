<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect — Dating Website V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff5f7;color:#222}
header{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 1px 8px #0001}
.logo{font-size:25px;font-weight:800;color:#e83e68}.btn{border:0;border-radius:24px;padding:11px 22px;font-weight:700;cursor:pointer}
.primary{background:#e83e68;color:#fff}.outline{background:#fff;color:#e83e68;border:1px solid #e83e68}
main{max-width:1050px;margin:auto;padding:35px 18px}.hero{text-align:center;padding:65px 15px}.hero h1{font-size:46px;margin:10px}.hero p{color:#666;font-size:18px}
.card{max-width:470px;margin:20px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0001}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}textarea{min-height:90px;resize:vertical}
.hidden{display:none}.msg{padding:10px;border-radius:10px;background:#f7f7f7;margin:10px 0;font-size:14px}
.profile{max-width:600px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px;color:#777;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">♥ Connect</div>
  <div id="nav"></div>
</header>

<main>
<section id="home" class="hero">
  <div style="font-size:58px">♥</div>
  <h1>Meet someone special.</h1>
  <p>Create your profile and start making genuine connections.</p>
  <button class="btn primary" onclick="show('signup')">Create Account</button>
  <button class="btn outline" onclick="show('login')">Login</button>
</section>

<section id="signup" class="card hidden">
<h2>Create your account</h2>
<form onsubmit="createAccount(event)">
<input id="sname" placeholder="Your name" required>
<input id="semail" type="email" placeholder="Email" required>
<input id="spass" type="password" placeholder="Password" minlength="6" required>
<input id="sage" type="number" min="18" placeholder="Age" required>
<select id="sgender" required><option value="">Gender</option><option>Man</option><option>Woman</option><option>Other</option></select>
<select id="slooking" required><option value="">Looking for</option><option>Men</option><option>Women</option><option>Everyone</option></select>
<input id="slocation" placeholder="Location" required>
<textarea id="sabout" placeholder="About me"></textarea>
<input id="sinterests" placeholder="Interests (e.g. movies, travel, music)">
<button class="btn primary" type="submit">Create Account</button>
</form>
<p class="small">Demo database: saved locally in this browser until Supabase is connected.</p>
<button class="btn outline" onclick="show('home')">Back</button>
</section>

<section id="login" class="card hidden">
<h2>Welcome back</h2>
<form onsubmit="login(event)">
<input id="lemail" type="email" placeholder="Email" required>
<input id="lpass" type="password" placeholder="Password" required>
<button class="btn primary" type="submit">Login</button>
</form>
<button class="btn outline" onclick="show('home')">Back</button>
</section>

<section id="profile" class="card profile hidden">
<div class="top"><h2>My Profile</h2><button class="btn outline" onclick="logout()">Logout</button></div>
<div id="profileData"></div>
<button class="btn primary" onclick="editProfile()">Edit Profile</button>
</section>

<section id="edit" class="card hidden">
<h2>Edit Profile</h2>
<form onsubmit="saveProfile(event)">
<input id="ename" placeholder="Your name" required>
<input id="eage" type="number" min="18" placeholder="Age" required>
<input id="elocation" placeholder="Location" required>
<textarea id="eabout" placeholder="About me"></textarea>
<input id="einterests" placeholder="Interests">
<button class="btn primary" type="submit">Save Changes</button>
</form>
<button class="btn outline" onclick="show('profile')">Cancel</button>
</section>
</main>

<script>
let currentUser = localStorage.getItem('connect_current');
function users(){return JSON.parse(localStorage.getItem('connect_users')||'[]')}
function saveUsers(u){localStorage.setItem('connect_users',JSON.stringify(u))}
function show(id){
 document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 if(id==='profile') renderProfile();
 updateNav();
}
function updateNav(){
 const n=document.getElementById('nav');
 n.innerHTML=currentUser?'<button class="btn outline" onclick="show(\'profile\')">My Profile</button>':'';
}
function createAccount(e){
 e.preventDefault();
 const u=users(), email=semail.value.trim().toLowerCase();
 if(u.some(x=>x.email===email)){alert('An account with this email already exists.');return}
 const user={id:crypto.randomUUID(),name:sname.value.trim(),email,password:spass.value,age:+sage.value,gender:sgender.value,looking:slooking.value,location:slocation.value.trim(),about:sabout.value.trim(),interests:sinterests.value.trim()};
 u.push(user);saveUsers(u);currentUser=user.id;localStorage.setItem('connect_current',currentUser);alert('Account created and saved.');show('profile');
}
function login(e){
 e.preventDefault();const email=lemail.value.trim().toLowerCase(),pass=lpass.value;
 const u=users().find(x=>x.email===email&&x.password===pass);
 if(!u){alert('Invalid email or password.');return}
 currentUser=u.id;localStorage.setItem('connect_current',currentUser);show('profile');
}
function getUser(){return users().find(x=>x.id===currentUser)}
function renderProfile(){
 const u=getUser();if(!u){show('home');return}
 profileData.innerHTML=`<div class="msg"><b>${esc(u.name)}</b>, ${u.age}<br>${esc(u.location)}<br><br><b>Looking for:</b> ${esc(u.looking)}<br><b>About:</b> ${esc(u.about||'Not added yet')}<br><b>Interests:</b> ${esc(u.interests||'Not added yet')}<br><br><b>Email:</b> ${esc(u.email)}</div>`;
}
function editProfile(){
 const u=getUser();ename.value=u.name;eage.value=u.age;elocation.value=u.location;eabout.value=u.about||'';einterests.value=u.interests||'';show('edit');
}
function saveProfile(e){
 e.preventDefault();const all=users(),i=all.findIndex(x=>x.id===currentUser);if(i<0)return;
 all[i].name=ename.value.trim();all[i].age=+eage.value;all[i].location=elocation.value.trim();all[i].about=eabout.value.trim();all[i].interests=einterests.value.trim();saveUsers(all);show('profile');
}
function logout(){currentUser=null;localStorage.removeItem('connect_current');show('home')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
updateNav(); if(currentUser)show('profile');
</script>
</body>
</html>
